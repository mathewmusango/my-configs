name: "Checks / YML"

# Reusable (workflow_call) — called by the repo's root checks.yml aggregator.
# actionlint on the GitHub Actions workflows + a YAML syntax parse of every
# yml/yaml in the repo (extension-wide — new yaml files are never missed, and
# workflow-file edits trigger actionlint: self-validation). A native git-diff
# detect job (no third-party action) gates the checks: when the push/PR
# touches no yml/yaml files they SKIP — report success — so requiring them
# never blocks unrelated commits. Same globs as scripts/checks/local.sh.
# One job per stage so a ruleset can gate each check independently.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # fetch-depth 0: push diffs compare against github.event.before, so the
      # previous commit must exist locally (shallow checkout would fail).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          base="${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}"
          if git diff --name-only --diff-filter=ACM "$base" "$GITHUB_SHA" | grep -qE '\.ya?ml$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  checks-yaml-syntax:
    name: checks-yaml-syntax
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse YAML (Ruby's built-in psych — no installs)
        run: |
          find . -path './.git' -prune -o -type f \( -name '*.yml' -o -name '*.yaml' \) -print 2>/dev/null | while IFS= read -r f; do
            ruby -ryaml -e "YAML.load_file(ARGV[0])" "$f"
            echo "ok: $f"
          done

  checks-yaml-actionlint:
    name: checks-yaml-actionlint
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # v2 required: v1 is a composite wrapping github-script@v7 internally,
      # which crashes on Node-24 runners (ERR_PACKAGE_PATH_NOT_EXPORTED).
      - uses: raven-actions/actionlint@v2
