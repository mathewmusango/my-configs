name: Checks

# Aggregator: one workflow per repo, name "Checks". Holds the triggers (only
# top-level workflow files are event-triggered) and calls the per-check
# reusables in checks/ — each self-gates on a dorny/paths-filter diff, so
# irrelevant checks SKIP (report success) and a ruleset can require them all.
# The reusables can also be called from other repos:
#   uses: mathewmusango/dotfiles/.github/workflows/checks/<name>.yml@main
# No paths filter here: every push to main runs the aggregator, and each
# reusable decides whether its check applies.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  jsonc:
    name: JSONC
    uses: ./.github/workflows/checks/jsonc.yml
  shell:
    name: Shell
    uses: ./.github/workflows/checks/shell.yml
  yml:
    name: YAML
    uses: ./.github/workflows/checks/yml.yml
