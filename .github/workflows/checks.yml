name: checks

# Aggregator: one workflow per repo. Holds the triggers (only top-level
# workflow files are event-triggered) and calls the per-check reusable
# workflows checks-{jsonc,shell,yaml}.yml — each self-gates on a native
# git-diff detect, so irrelevant checks SKIP (report success) and a ruleset
# can require them all. GitHub requires reusable workflows at the TOP level
# of .github/workflows/ (subdirectories are rejected). Names come from the
# filenames/job keys (no name: overrides). The reusables can also be called
# from other repos:
#   uses: mathewmusango/dotfiles/.github/workflows/checks-yaml.yml@main
# No paths filter here: every push to main runs the aggregator, and each
# reusable decides whether its check applies.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  jsonc:
    uses: ./.github/workflows/checks-jsonc.yml
  shell:
    uses: ./.github/workflows/checks-shell.yml
  yaml:
    uses: ./.github/workflows/checks-yaml.yml
