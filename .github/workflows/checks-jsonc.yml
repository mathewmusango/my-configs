name: "checks/jsonc"

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        shell: bash
        run: |
          base="${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}"
          if git diff --name-only --diff-filter=ACM "$base" "$GITHUB_SHA" | grep -qE '\.jsonc$|scripts/checks/jsonc\.py$'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  jsonc:
    name: jsonc
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse config.jsonc files
        run: python3 scripts/checks/jsonc.py
      - name: Design folders ship config.jsonc + screenshot.png
        run: |
          set -e
          if ls fastfetch/*/ >/dev/null 2>&1; then
            for d in fastfetch/*/; do
              if [ ! -f "$d/config.jsonc" ] || [ ! -f "$d/screenshot.png" ]; then
                echo "incomplete design: $d"
                exit 1
              fi
            done
            echo "all designs complete"
          else
            echo "no fastfetch designs — skipping"
          fi
