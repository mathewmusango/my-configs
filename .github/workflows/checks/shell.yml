name: Checks / Shell

# Reusable (workflow_call) — called by the root checks.yml aggregator.
# Shellcheck on every shell script in the repo (modules' install.sh, etc.) —
# extension-wide so NEW shell scripts in new locations are never missed.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        # ubuntu-latest runners ship shellcheck; the koalaman/shellcheck-action
        # repo no longer resolves on GitHub ("repository not found").
        run: |
          find . -path './.git' -prune -o -type f -name '*.sh' -print0 2>/dev/null | xargs -0 -r shellcheck -S warning
