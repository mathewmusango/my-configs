name: "Checks / Shell"

# Reusable (workflow_call) — called by the repo's root checks.yml aggregator.
# Shellcheck on every shell script in the repo, plus .githooks/* (extension-
# wide so NEW shell scripts in new locations are never missed). A detect job
# (dorny/paths-filter) gates the check: when the push/PR touches no shell
# files the check SKIPS — reports success — so requiring it never blocks
# unrelated commits.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # fetch-depth 0: push diffs compare against github.event.before, so the
      # previous commit must exist locally (shallow checkout would fail).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          ref: ${{ github.sha }}
          filters: |
            changed:
              - '**/*.sh'
              - '.githooks/**'

  checks-shell-shellcheck:
    name: checks-shell-shellcheck
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck
        # ubuntu-latest runners ship shellcheck; the koalaman/shellcheck-action
        # repo no longer resolves on GitHub ("repository not found").
        run: |
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -path './.githooks/*' \) -print0 2>/dev/null | xargs -0 -r shellcheck -S warning
