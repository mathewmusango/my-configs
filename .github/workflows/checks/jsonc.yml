name: Checks / JSONC

# Reusable (workflow_call) — called by the repo's root checks.yml aggregator.
# Validate every fastfetch design config (config.jsonc) parses as JSON, and
# every design folder ships both files (config.jsonc + screenshot.png). A
# detect job (dorny/paths-filter) gates the check: when the push/PR touches no
# jsonc files it SKIPS — reports success — so requiring it never blocks
# unrelated commits.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
      # fetch-depth 0: push diffs compare against github.event.before, so the
      # previous commit must exist locally (shallow checkout would fail).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          ref: ${{ github.sha }}
          filters: |
            changed:
              - '**/*.jsonc'
              - 'scripts/check_jsonc.py'

  checks-jsonc:
    name: checks-jsonc
    needs: detect
    if: ${{ github.event_name == 'workflow_dispatch' || needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Parse config.jsonc files
        # jq can't parse JSONC (comments/trailing commas) — strip them, then
        # json.loads. python3 json is stdlib, no installs.
        run: python3 scripts/check_jsonc.py
      - name: Design folders ship config.jsonc + screenshot.png
        # No fastfetch/ in a calling repo? Skip (glob has no matches).
        run: |
          set -e
          if ls fastfetch/*/ >/dev/null 2>&1; then
            for d in fastfetch/*/; do
              if [ ! -f "$d/config.jsonc" ] || [ ! -f "$d/screenshot.png" ]; then
                echo "incomplete design: $d"
                exit 1
              fi
            done
            echo "all designs complete"
          else
            echo "no fastfetch designs — skipping"
          fi
